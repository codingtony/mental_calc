<!doctype html>
<html lang="sv">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0" />
    <title>Mental Calc GP</title>
  </head>
  <body>
    <canvas id="renderCanvas"></canvas>
    <p id="boot" class="boot" data-i18n="loading"></p>

    <section id="screen-intro" class="screen hidden">
      <h1 class="title" id="intro-title">Mental Calc GP</h1>
      <p class="tagline" data-i18n="tagline"></p>
      <p class="skip" data-i18n="skip"></p>
    </section>

    <section id="screen-menu" class="screen hidden">
      <div class="panel">
        <div class="flags">
          <button class="flag" data-lang="sv" aria-label="Svenska">
            <svg viewBox="0 0 16 10"><rect width="16" height="10" fill="#006AA7"/><rect x="5" width="2" height="10" fill="#FECC00"/><rect y="4" width="16" height="2" fill="#FECC00"/></svg>
          </button>
          <button class="flag" data-lang="en" aria-label="English">
            <svg viewBox="0 0 60 30"><clipPath id="gbt"><path d="M30,15 h30 v15 z v15 h-30 z h-30 v-15 z v-15 h30 z"/></clipPath><path d="M0,0 v30 h60 v-30 z" fill="#00247d"/><path d="M0,0 L60,30 M60,0 L0,30" stroke="#fff" stroke-width="6"/><path d="M0,0 L60,30 M60,0 L0,30" clip-path="url(#gbt)" stroke="#cf142b" stroke-width="4"/><path d="M30,0 v30 M0,15 h60" stroke="#fff" stroke-width="10"/><path d="M30,0 v30 M0,15 h60" stroke="#cf142b" stroke-width="6"/></svg>
          </button>
          <button class="flag" data-lang="fr" aria-label="Français">
            <svg viewBox="0 0 3 2"><rect width="1" height="2" fill="#0055A4"/><rect x="1" width="1" height="2" fill="#fff"/><rect x="2" width="1" height="2" fill="#EF4135"/></svg>
          </button>
        </div>
        <h1 class="title small">Mental Calc GP</h1>

        <div class="menu-options">
          <button id="solo-btn" class="big-btn" data-i18n="solo"></button>
          <button id="host-btn" class="big-btn" data-i18n="mpHost"></button>
          <button id="join-btn" class="big-btn" data-i18n="mpJoin"></button>
        </div>
        <p id="menu-error" class="error"></p>

        <div class="choices toggles">
          <button class="choice" id="toggle-music"><span class="audio-icon"></span><span data-i18n="music"></span></button>
          <button class="choice" id="toggle-sound"><span class="audio-icon"></span><span data-i18n="sound"></span></button>
        </div>
        <p class="credits"><button id="about-btn" class="link-btn" data-i18n="about"></button></p>
      </div>
    </section>

    <dialog id="about" aria-labelledby="about-title">
      <div class="panel">
        <h2 id="about-title" class="heading" data-i18n="about"></h2>
        <p class="about-copyright"><span>Mental Calc GP</span> Copyright © 2026 Tony&nbsp;Bussières</p>
        <p class="subtle">
          <span data-i18n="aboutLicense"></span>
          <a href="https://github.com/codingtony/mental_calc/blob/main/LICENSE" target="_blank" rel="noopener" data-i18n="mitLicense"></a>
        </p>
        <a class="github-link" href="https://github.com/codingtony/mental_calc" target="_blank" rel="noopener">
          <svg viewBox="0 0 16 16" aria-hidden="true"><path fill="currentColor" d="M6.766 11.328c-2.063-.25-3.516-1.734-3.516-3.656 0-.781.281-1.625.75-2.188-.203-.515-.172-1.609.063-2.062.625-.078 1.468.25 1.968.703.594-.187 1.219-.281 1.985-.281.765 0 1.39.094 1.953.265.484-.437 1.344-.765 1.969-.687.218.422.25 1.515.046 2.047.5.593.766 1.39.766 2.203 0 1.922-1.453 3.375-3.547 3.64.531.344.89 1.094.89 1.954v1.625c0 .468.391.734.86.547C13.781 14.359 16 11.53 16 8.03 16 3.61 12.406 0 7.984 0 3.563 0 0 3.61 0 8.031a7.88 7.88 0 0 0 5.172 7.422c.422.156.828-.125.828-.547v-1.25c-.219.094-.5.156-.75.156-1.031 0-1.64-.562-2.078-1.609-.172-.422-.36-.672-.719-.719-.187-.015-.25-.093-.25-.187 0-.188.313-.328.625-.328.453 0 .844.281 1.25.86.313.452.64.655 1.031.655s.641-.14 1-.5c.266-.265.47-.5.657-.656"/></svg>
          codingtony/mental_calc
        </a>
        <p class="field-label" data-i18n="models3d"></p>
        <ul class="about-credits">
          <li>
            <a href="https://poly.pizza/m/dse64pqMKAR" target="_blank" rel="noopener">Motorcycle</a> · Poly&nbsp;by&nbsp;Google&nbsp;·
            <a href="https://creativecommons.org/licenses/by/3.0/" target="_blank" rel="noopener">CC-BY&nbsp;3.0</a>
          </li>
          <li><span data-i18n="creditsQuaternius"></span> · <a href="https://poly.pizza/u/Quaternius" target="_blank" rel="noopener">Quaternius</a>&nbsp;·&nbsp;CC0</li>
          <li><a href="https://kenney.nl/assets/racing-kit" target="_blank" rel="noopener">Racing&nbsp;Kit</a> · Kenney&nbsp;·&nbsp;CC0</li>
        </ul>
        <form method="dialog"><button class="secondary-btn" data-i18n="close" autofocus></button></form>
      </div>
    </dialog>

    <section id="screen-setup" class="screen hidden">
      <div class="panel">
        <h2 class="heading" data-i18n="solo"></h2>

        <label class="field-label" for="name" data-i18n="nameLabel"></label>
        <input id="name" maxlength="16" autocomplete="off" data-i18n-placeholder="namePlaceholder" />
        <p id="name-error" class="error"></p>

        <p class="field-label" data-i18n="modeLabel"></p>
        <div class="choices">
          <button class="choice" data-mode="single" data-i18n="modeSingle"></button>
          <button class="choice" data-mode="championship" data-i18n="modeChampionship"></button>
        </div>

        <div id="setup-race-options">
          <p class="field-label" data-i18n="categoryLabel"></p>
          <div class="choices">
            <button class="choice" data-category="10"><span>10</span><small data-i18n="questionsWord"></small></button>
            <button class="choice" data-category="30"><span>30</span><small data-i18n="questionsWord"></small></button>
            <button class="choice" data-category="50"><span>50</span><small data-i18n="questionsWord"></small></button>
            <button class="choice" data-category="120"><span>120</span><small data-i18n="questionsWord"></small></button>
          </div>

          <p class="field-label" data-i18n="difficultyLabel"></p>
          <div class="choices">
            <button class="choice" data-difficulty="easy"><span data-i18n="easy"></span><small></small></button>
            <button class="choice" data-difficulty="medium"><span data-i18n="medium"></span><small></small></button>
            <button class="choice" data-difficulty="hard"><span data-i18n="hard"></span><small></small></button>
          </div>
        </div>
        <p id="setup-champ-info" class="subtle hidden"></p>

        <div class="choices">
          <button id="next-btn" class="big-btn" data-i18n="next"></button>
          <button id="setup-back" class="secondary-btn" data-i18n="back"></button>
        </div>
      </div>
    </section>

    <section id="screen-cups" class="screen hidden">
      <div class="panel wide">
        <h2 class="heading" data-i18n="chooseCup"></h2>
        <p id="cups-config" class="subtle"></p>
        <div id="cups" class="cups">
          <button class="cup" data-cup="add"><span class="cup-icon"></span><span class="cup-name"></span><small class="cup-best"></small></button>
          <button class="cup" data-cup="addsub"><span class="cup-icon"></span><span class="cup-name"></span><small class="cup-best"></small></button>
          <button class="cup" data-cup="mul"><span class="cup-icon"></span><span class="cup-name"></span><small class="cup-best"></small></button>
          <button class="cup" data-cup="muldiv"><span class="cup-icon"></span><span class="cup-name"></span><small class="cup-best"></small></button>
          <button class="cup" data-cup="all"><span class="cup-icon"></span><span class="cup-name"></span><small class="cup-best"></small></button>
        </div>
        <button id="cups-back" class="secondary-btn" data-i18n="back"></button>
      </div>
    </section>

    <section id="screen-join" class="screen hidden">
      <div class="panel">
        <h2 class="heading" data-i18n="mpJoin"></h2>
        <label class="field-label" for="join-code" data-i18n="mpCodeLabel"></label>
        <input id="join-code" class="text-input code-input" maxlength="5" autocomplete="off" autocapitalize="characters" spellcheck="false" />
        <label class="field-label" for="join-name" data-i18n="nameLabel"></label>
        <input id="join-name" class="text-input" maxlength="16" autocomplete="off" data-i18n-placeholder="namePlaceholder" />
        <p id="join-error" class="error"></p>
        <button id="join-go" class="big-btn" data-i18n="mpJoinGo"></button>
        <button id="join-back" class="secondary-btn" data-i18n="back"></button>
      </div>
    </section>

    <section id="screen-wait" class="screen hidden">
      <div class="panel">
        <h2 id="wait-code" class="heading room-code"></h2>
        <p id="wait-caption" class="subtle"></p>
        <ul id="wait-names" class="names"></ul>
        <button id="wait-leave" class="secondary-btn" data-i18n="mpLeave"></button>
      </div>
    </section>

    <section id="screen-host" class="screen hidden">
      <div class="panel host">
        <div id="host-lobby">
          <div class="host-join">
            <div>
              <p class="field-label" data-i18n="mpCodeLabel"></p>
              <div id="host-code" class="room-code big"></div>
              <p class="subtle"><span data-i18n="mpScanToJoin"></span><br /><a id="host-url" target="_blank" rel="noopener"></a></p>
            </div>
            <img id="host-qr" alt="" width="220" height="220" />
          </div>
          <p class="field-label" data-i18n="mpRace"></p>
          <div class="host-settings">
            <label class="field-label" for="host-scenery" data-i18n="sceneryLabel"></label>
            <select id="host-scenery"></select>
            <span class="field-label" data-i18n="cupLabel"></span>
            <div class="choices compact">
              <button class="choice" data-host-cup="add"></button>
              <button class="choice" data-host-cup="addsub"></button>
              <button class="choice" data-host-cup="mul"></button>
              <button class="choice" data-host-cup="muldiv"></button>
              <button class="choice" data-host-cup="all"></button>
            </div>
            <span class="field-label" data-i18n="categoryLabel"></span>
            <div class="choices compact">
              <button class="choice" data-host-n="10">10</button>
              <button class="choice" data-host-n="30">30</button>
              <button class="choice" data-host-n="50">50</button>
              <button class="choice" data-host-n="120">120</button>
            </div>
            <span class="field-label" data-i18n="difficultyLabel"></span>
            <div class="choices compact">
              <button class="choice" data-host-difficulty="easy"><span data-i18n="easy"></span><small></small></button>
              <button class="choice" data-host-difficulty="medium"><span data-i18n="medium"></span><small></small></button>
              <button class="choice" data-host-difficulty="hard"><span data-i18n="hard"></span><small></small></button>
            </div>
          </div>
          <p id="host-count" class="field-label"></p>
          <div class="scroll-box hidden">
            <button id="host-players-less" class="more-hint up hidden" aria-hidden="true" tabindex="-1">▲</button>
            <ul id="host-players" class="names"></ul>
            <button id="host-players-more" class="more-hint hidden" aria-hidden="true" tabindex="-1">▼</button>
          </div>
          <div class="choices">
            <button id="host-start" class="big-btn" data-i18n="mpStart"></button>
            <button id="host-close" class="secondary-btn" data-i18n="mpCloseRoom"></button>
          </div>
        </div>
        <div id="host-board" class="hidden">
          <div class="host-bar">
            <span id="host-room" class="room-code"></span>
            <span id="host-counter"></span>
            <span id="host-timer"></span>
          </div>
          <div id="host-podium" class="podium-wrap hidden"></div>
          <div class="scroll-box">
            <button id="lanes-less" class="more-hint up hidden" aria-hidden="true" tabindex="-1">▲</button>
            <ol id="lanes"></ol>
            <button id="lanes-more" class="more-hint hidden" aria-hidden="true" tabindex="-1">▼</button>
          </div>
          <div class="choices">
            <label class="checkbox"><input id="host-showall" type="checkbox" /> <span data-i18n="mpShowAll"></span></label>
            <button id="host-end" class="big-btn" data-i18n="mpEnd"></button>
            <button id="host-rematch" class="big-btn" data-i18n="mpRematch"></button>
            <button id="host-close2" class="secondary-btn" data-i18n="mpCloseRoom"></button>
          </div>
        </div>
      </div>
    </section>

    <section id="hud" class="hidden">
      <div id="question">
        <div id="question-text"></div>
        <div class="answer-row">
          <input id="answer" inputmode="numeric" pattern="[0-9]*" maxlength="4" autocomplete="off" />
          <button id="answer-ok">OK</button>
        </div>
        <div id="toast"></div>
      </div>
      <div id="position"></div>
      <div id="race-info">
        <div id="race-name"></div>
        <div id="timer"></div>
        <div id="goal-time"></div>
        <div id="lap"></div>
        <div id="qcount"></div>
        <div id="mp-me"></div>
      </div>
      <ol id="standings"></ol>
      <div id="lives"></div>
      <div id="hud-controls">
        <button id="hud-music" class="icon-btn"><span class="audio-icon"></span><span data-i18n="music"></span></button>
        <button id="hud-sound" class="icon-btn"><span class="audio-icon"></span><span data-i18n="sound"></span></button>
        <button id="quit-btn" class="icon-btn" data-i18n="quit"></button>
      </div>
    </section>

    <div id="countdown" class="hidden">
      <div class="lights"><span></span><span></span><span></span></div>
      <div id="countdown-text"></div>
      <div id="countdown-hint"></div>
    </div>

    <div id="banner" class="hidden"></div>
    <div id="trophy-title" class="hidden"></div>
    <div id="track-map" class="hidden"></div>

    <div id="mp-offline" class="hidden" data-i18n="mpReconnecting"></div>

    <section id="screen-results" class="screen hidden">
      <div class="panel wide results">
        <h2 id="result-title" class="heading"></h2>
        <div id="mp-podium" class="podium-wrap hidden"></div>
        <div id="result-position"></div>
        <dl id="result-stats"></dl>
        <div class="tabs">
          <button class="tab" data-board="last" data-i18n="lastGames"></button>
          <button class="tab" data-board="high" data-i18n="highScores"></button>
        </div>
        <p id="champ-board-title" class="field-label hidden" data-i18n="champRecords"></p>
        <div id="board-box" class="scroll-box">
          <button id="board-less" class="more-hint up hidden" aria-hidden="true" tabindex="-1">▲</button>
          <div class="board-wrap"><table id="board"></table></div>
          <button id="board-more" class="more-hint hidden" aria-hidden="true" tabindex="-1">▼</button>
        </div>
        <div class="choices">
          <button id="again-btn" class="big-btn" data-i18n="raceAgain"></button>
          <button id="champ-next-btn" class="big-btn hidden" data-i18n="champNext"></button>
          <button id="cups-btn" class="secondary-btn" data-i18n="changeCup"></button>
          <button id="menu-btn" class="secondary-btn" data-i18n="menu"></button>
          <button id="mp-leave-btn" class="secondary-btn hidden" data-i18n="mpLeave"></button>
        </div>
      </div>
    </section>

    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
