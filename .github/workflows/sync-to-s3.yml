name: Sync to S3

on:
  push:
    branches:
      - main
    paths-ignore:
      - "relay/**"

jobs:
  sync:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v7

    - name: Configure AWS credentials
      uses: aws-actions/configure-aws-credentials@v6
      with:
        aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
        aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
        aws-region: us-east-1

    - name: Version (game v1)
      run: |
        REV=$(git rev-parse HEAD)
        jq -nc --arg rev "$REV" '{ version: $rev }' > 1/version.json
        sed -i "s/__VERSION__/$REV/g" 1/index.html

    - name: Setup Node.js
      uses: actions/setup-node@v7
      with:
        node-version: 'lts/*'
        cache: 'npm'
        cache-dependency-path: package-lock.json

    - name: Build game v2
      run: |
        npm ci
        npm run build

    # vite-plugin-compression emits only .gz files; strip the suffix so S3
    # serves them under their real names, tagged as gzip-encoded.
    - name: Strip .gz suffixes from game v2 bundle
      run: find dist -name '*.gz' -exec sh -c 'mv "$1" "${1%.gz}"' _ {} \;

    - name: Sync game v1 to /1
      run: aws s3 sync 1 s3://maths.codingtony.com/1 --delete --exclude '*' --include '*.js' --include '*.html' --include '*.json' --include '*.css'

    # /2/ used to host v2; this stub forwards old links and ?room= QR codes to /.
    - name: Sync /2 redirect
      run: aws s3 sync 2 s3://maths.codingtony.com/2 --delete

    # Root = game v2. No --delete: other objects may live at the bucket root.
    - name: Sync game v2 bundle to /
      run: aws s3 sync dist s3://maths.codingtony.com --content-encoding gzip

    - name: Invalidate CloudFront cache
      run: aws cloudfront create-invalidation --distribution-id "${{ vars.CLOUDFRONT_DISTRIBUTION_ID }}" --paths '/*'