name: Sync to S3

on:
  push:
    branches:
      - main

jobs:
  sync:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v2

    - name: Configure AWS credentials
      uses: aws-actions/configure-aws-credentials@v1
      with:
        aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
        aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
        aws-region: us-east-1

    - name: Version
      run: | 
        REV=$(git rev-parse HEAD)
        jq -nc --arg rev "$REV" '{ version: $rev }' > version.json
        sed -i "s/__VERSION__/$REV/g" index.html

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: 'lts/*'
        cache: 'npm'
        cache-dependency-path: 2/package-lock.json

    - name: Build game v2
      working-directory: 2
      run: |
        npm ci
        npm run build

    - name: Sync original game to S3
      run: aws s3 sync . s3://maths.codingtony.com --exclude '*' --include '*.js' --include '*.html' --include '*.json' --include '*.css' --exclude '2/*'

    - name: Sync game v2 bundle to S3
      run: aws s3 sync 2/dist s3://maths.codingtony.com/2 --delete