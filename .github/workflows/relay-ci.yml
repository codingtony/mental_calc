name: Relay CI

on:
  push:
    branches: [main]
    paths: ["relay/**", ".github/workflows/relay-ci.yml"]
  pull_request:
    paths: ["relay/**", ".github/workflows/relay-ci.yml"]

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: relay

    steps:
    - name: Checkout code
      uses: actions/checkout@v7

    - name: Setup Go
      uses: actions/setup-go@v5
      with:
        go-version-file: relay/go.mod
        cache-dependency-path: relay/go.sum

    - name: Vet and test
      run: go vet ./... && go test ./...

    - name: Build
      run: CGO_ENABLED=0 go build -trimpath -ldflags "-s -w" -o mc-relay .

    - name: Scenario simulation (60 scenarios against the built relay)
      run: scripts/ci-sim.sh ./mc-relay
