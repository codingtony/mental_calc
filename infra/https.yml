# HTTPS for maths.codingtony.com: ACM certificate + CloudFront distribution in
# front of the S3 website endpoint. Not deployed by CI; run once by hand.
#
# Runbook (credentials allowed to manage this stack, its certificate and
# distribution, plus Gandi access; always pass --region us-east-1, CloudFront
# only accepts ACM certificates from us-east-1). The CI user additionally needs
# cloudfront:CreateInvalidation on the distribution (granted in IAM, not here).
#
# Complete every step BEFORE pushing the CI invalidation step to main,
# otherwise the deploy job fails for lack of CLOUDFRONT_DISTRIBUTION_ID.
#
# 1. Deploy (blocks until the certificate is validated):
#      aws cloudformation deploy --region us-east-1 --stack-name maths-codingtony-https \
#        --template-file infra/https.yml
#
# 2. While it blocks, fetch the ACM validation record:
#      aws cloudformation describe-stack-events --region us-east-1 --stack-name maths-codingtony-https \
#        --query "StackEvents[?ResourceType=='AWS::CertificateManager::Certificate'].ResourceStatusReason" --output text
#    or:
#      aws acm describe-certificate --region us-east-1 \
#        --certificate-arn <arn from: aws acm list-certificates --region us-east-1> \
#        --query "Certificate.DomainValidationOptions[0].ResourceRecord"
#    Add it at Gandi as a CNAME (name `_xxxx.maths`, value `_yyyy....acm-validations.aws.`).
#    Keep it forever: ACM uses it for auto-renewal. CloudFront then takes ~5-15 min.
#
# 3. Read the outputs:
#      aws cloudformation describe-stacks --region us-east-1 --stack-name maths-codingtony-https \
#        --query "Stacks[0].Outputs"
#
# 4. Check before the DNS cutover (expect HTTP/2 200 with an x-cache header):
#      curl -sI --connect-to maths.codingtony.com:443:<DistributionDomainName>:443 https://maths.codingtony.com/
#
# 5. Give CI the distribution id:
#      gh variable set CLOUDFRONT_DISTRIBUTION_ID --body <DistributionId> --repo codingtony/mental_calc
#
# 6. Gandi: point the `maths` CNAME at `<DistributionDomainName>.` (was
#    `codingtony.com.s3-website-us-east-1.amazonaws.com.`). After the TTL:
#      curl -sI https://maths.codingtony.com/   -> 200
#
# Rollback after a failed certificate validation:
#      aws cloudformation delete-stack --region us-east-1 --stack-name maths-codingtony-https
AWSTemplateFormatVersion: "2010-09-09"
Description: HTTPS for maths.codingtony.com (ACM + CloudFront in front of the S3 website endpoint)
Resources:
  Certificate:
    Type: AWS::CertificateManager::Certificate
    Properties:
      DomainName: maths.codingtony.com
      ValidationMethod: DNS
  Distribution:
    Type: AWS::CloudFront::Distribution
    Properties:
      DistributionConfig:
        Enabled: true
        Comment: maths.codingtony.com
        Aliases: [maths.codingtony.com]
        HttpVersion: http2and3
        IPV6Enabled: true
        PriceClass: PriceClass_100
        Origins:
          # Website endpoint (not the REST endpoint): it resolves /2/ to /2/index.html.
          - Id: s3-website
            DomainName: maths.codingtony.com.s3-website-us-east-1.amazonaws.com
            CustomOriginConfig:
              OriginProtocolPolicy: http-only
              HTTPPort: 80
        DefaultCacheBehavior:
          TargetOriginId: s3-website
          ViewerProtocolPolicy: redirect-to-https
          CachePolicyId: 658327ea-f89d-4fab-a63d-7e88639e58f6  # Managed-CachingOptimized
          Compress: true
          AllowedMethods: [GET, HEAD]
        ViewerCertificate:
          AcmCertificateArn: !Ref Certificate
          SslSupportMethod: sni-only
          MinimumProtocolVersion: TLSv1.2_2021
Outputs:
  DistributionId:
    Value: !Ref Distribution
  DistributionDomainName:
    Value: !GetAtt Distribution.DomainName
